# Release pipeline. release-please keeps a release PR up to date on every push
# to main. That PR is metadata-only — CHANGELOG, package.json/package-lock.json
# version, and the release-please manifest — and never touches dist/: the
# bundle does not embed a version (the runtime logs GITHUB_ACTION_REF instead),
# so the dist/ committed by contributors on regular PRs (enforced by the
# required Check dist check) is already the released bundle.
#
# When the release PR is merged, release-please creates a DRAFT release and
# its git tag at the merge commit; the security gate evaluates the GHAS
# remediation-SLA policy, the bundle is provenance-attested, an SBOM is
# attached, the floating v{major} / v{major}.{minor} tags are moved, and the
# release is published. Everything runs as dependent jobs in a SINGLE workflow
# run on the default GITHUB_TOKEN — no PAT or GitHub App token.
#
# The tag exists before the gate because force-tag-creation is set in
# release-please-config.json: GitHub does not create a draft release's tag
# until it is published, and without the tag release-please cannot find the
# release boundary and proposes a bogus version bump in the next release PR.
# The early semver tag is resolvable in `uses:` from the moment it exists,
# i.e. before the gate passes; only the floating v{major} / v{major}.{minor}
# tags — the refs consumers are documented to pin — are gated.
#
# Recovering a stalled release: release-please creates a release only once, so
# re-running this workflow after a failed gate reports no release and skips
# everything downstream. Instead, run it manually (workflow_dispatch) on main
# with the stalled release's tag. That resolves the existing DRAFT release and
# runs the gate, attestation, SBOM, tag move and publish for it. Only draft
# releases whose commit is on main are accepted, so a published version can
# never be re-published or have the floating tags moved back onto it.
#
# Known limitation: PRs created with the default GITHUB_TOKEN do not trigger
# other workflows, so the release PR's required checks will not start on their
# own. Look for an "Approve workflows to run" button on the PR itself.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the stalled draft release to finish, e.g. v1.2.3'
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # Each output comes from release-please on push, or from the existing draft
    # release on workflow_dispatch; only one of the two steps runs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.existing.outputs.release_created || false }}
      release_id: ${{ steps.release.outputs.id || steps.existing.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.existing.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha || steps.existing.outputs.sha }}
      major: ${{ steps.release.outputs.major || steps.existing.outputs.major }}
      minor: ${{ steps.release.outputs.minor || steps.existing.outputs.minor }}
    steps:
      - name: Run release-please
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the stalled draft release
        id: existing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow on main, not $REF."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          # Drafts are only visible through the list endpoint, not get-by-tag.
          release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | {id, draft}')
          if [[ -z "$release" ]]; then
            echo "::error::No release found for $TAG."
            exit 1
          fi
          if [[ "$(jq -r .draft <<<"$release")" != true ]]; then
            echo "::error::$TAG is already published; only a draft release can be finished."
            exit 1
          fi

          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...main" --jq .status)
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::$TAG ($sha) is not on main (compare status: $status)."
            exit 1
          fi

          {
            echo "release_created=true"
            echo "id=$(jq -r .id <<<"$release")"
            echo "tag_name=$TAG"
            echo "sha=$sha"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

  security-gate:
    name: Security Gate
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read # read Code Scanning alerts to evaluate the SLA policy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Security gate
        uses: ./.github/actions/security-gate

  attest:
    name: Attest dist
    needs: [release-please, security-gate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Attest dist/index.js
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/index.js

      - name: Upload attestation bundle to draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              name: 'attestation.sigstore.json',
              data: fs.readFileSync(process.env.BUNDLE_PATH),
            });

  # GitHub's Dependency Graph REST API returns an SPDX SBOM directly. Note:
  # this is a dependency-graph SBOM (the resolved npm dependencies), not a
  # per-artifact bill of materials of the bundled dist/index.js. It is
  # best-effort: it does not block publish (see the publish-release job's
  # `if`) and continue-on-error keeps a failed SBOM from failing the run.
  sbom:
    name: Generate SBOM
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write # read the dependency graph and attach the SBOM to the release
    steps:
      - name: Generate SBOM
        id: sbom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          file="workload-credentials-action_${TAG_NAME#v}_sbom.spdx.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
            --jq '.sbom' > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attach SBOM to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          SBOM_FILE: ${{ steps.sbom.outputs.file }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" --clobber "$TAG_NAME" "$SBOM_FILE"

  tag-major-minor:
    name: Move major and minor tags
    # Gated on security-gate: consumers track @v{major}, so moving the floating
    # tags is the de facto release and must not happen when the gate fails.
    needs: [release-please, security-gate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move v{major} and v{major}.{minor} tags to the released commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
          MINOR_TAG: v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        with:
          script: |
            const sha      = process.env.RELEASE_SHA;
            const tagName  = process.env.TAG_NAME;
            const majorTag = process.env.MAJOR_TAG;
            const minorTag = process.env.MINOR_TAG;

            // Move a floating tag to `sha`. If the ref does not exist yet
            // (first release on this major/minor line), create it instead.
            // We do not need an annotated tag object here - lightweight tags
            // are sufficient for consumer pinning (`uses: org/action@v1`)
            // and they are what google-github-actions and most marketplace
            // actions publish for their floating refs. The semver tag
            // (e.g. v1.2.3) created by release-please remains annotated.
            async function upsertTag(refName) {
              try {
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  ref:   `tags/${refName}`,
                  sha:   sha,
                  force: true,
                });
                core.info(`Moved tag ${refName} -> ${sha} (${tagName})`);
                return;
              } catch (err) {
                core.info(
                  `updateRef failed for ${refName} (${err.message}); ` +
                  `attempting createRef`
                );
              }

              // Fall-through path: ref did not exist, create it.
              // If THIS call also fails the error propagates and fails the job.
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `refs/tags/${refName}`,
                sha:   sha,
              });
              core.info(`Created tag ${refName} at ${sha} (${tagName})`);
            }

            await upsertTag(majorTag);
            await upsertTag(minorTag);

  publish-release:
    name: Publish release
    needs: [release-please, security-gate, attest, tag-major-minor, sbom]
    # always() prevents upstream "skipped" status from auto-skipping this job;
    # the explicit result checks ensure we only publish when the gate, the
    # attestation, and the tag moves all succeeded. The SBOM is best-effort:
    # it is in `needs` only for ordering and does not block publish.
    if: >-
      ${{ always() &&
          needs.release-please.outputs.release_created == 'true' &&
          needs.security-gate.result == 'success' &&
          needs.attest.result == 'success' &&
          needs.tag-major-minor.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false,
            });
